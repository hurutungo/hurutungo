name: Check apple-app-site-association

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch AASA from hurutungo.com
        run: |
          status=$(curl -s -o body.json -w '%{http_code}' -L --max-redirs 0 \
            https://hurutungo.com/.well-known/apple-app-site-association)
          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::apple-app-site-association did not return 200 (got $status)"
            cat body.json
            exit 1
          fi

      - name: Validate JSON and appIDs
        run: |
          python3 -c "
          import json, sys
          data = json.load(open('body.json'))
          app_ids = [
              aid
              for detail in data['applinks']['details']
              for aid in detail.get('appIDs', [])
          ]
          if 'hurutungo.AnimeFillers' not in ' '.join(app_ids):
              print('::error::hurutungo.AnimeFillers not found in appIDs:', app_ids)
              sys.exit(1)
          print('OK — appIDs:', app_ids)
          "
